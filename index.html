<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinPoint</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>

  <!-- Apple HIG 极简浮动工具栏 -->
  <header class="hud-bar">
    <div class="hud-title">
      <span class="hud-title-dot"></span>
      <span>PinPoint</span>
    </div>
    <span class="hud-file-status" id="hud-file-status"></span>
    <div class="hud-divider"></div>
    <div class="hud-actions">
      <button class="hud-btn" id="btn-add-node" data-tooltip="新建节点">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="hud-btn" id="btn-open" data-tooltip="打开文件">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <button class="hud-btn" id="btn-save" data-tooltip="保存图谱 (Ctrl+S)">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      </button>
      <button class="hud-btn" id="btn-reset" data-tooltip="重置画布">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
      </button>
    </div>
  </header>

  <!-- 无限画布视口 -->
  <main id="viewport">
    <div id="board">
      <svg id="wire-svg"></svg>
      <div id="cards-container"></div>
    </div>
  </main>

  <!-- 划选/改色浮动工具栏（5常用色 + 1调色盘 + 确认应用按钮） -->
  <div id="selection-popover">
    <div class="popover-colors-row">
      <button class="popover-color-btn" data-color="#30d158" style="--btn-color: #30d158;" title="绿色"></button>
      <button class="popover-color-btn" data-color="#0a84ff" style="--btn-color: #0a84ff;" title="蓝色"></button>
      <button class="popover-color-btn" data-color="#bf5af2" style="--btn-color: #bf5af2;" title="紫色"></button>
      <button class="popover-color-btn" data-color="#ffd60a" style="--btn-color: #ffd60a;" title="黄色"></button>
      <button class="popover-color-btn" data-color="#ff9f0a" style="--btn-color: #ff9f0a;" title="橙色"></button>
      <div class="popover-divider"></div>
      <label class="popover-palette-btn" title="自定义调色盘">
        <input type="color" class="popover-color-picker" value="#30d158" />
      </label>
    </div>
    <button class="popover-apply-btn" id="popover-apply-btn" title="确认应用此颜色">
      <span class="apply-color-dot"></span>
      <span>应用</span>
    </button>
  </div>

  <!-- 原生 ES 模块启动 -->
  <script type="module" src="src/main.js"></script>
</body>
</html>

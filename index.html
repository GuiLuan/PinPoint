<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinPoint</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>

  <!-- Apple HIG 极简浮动工具栏 -->
  <header class="hud-bar">
    <div class="hud-title">
      <span class="hud-title-dot"></span>
      <span>PinPoint</span>
    </div>
    <span class="hud-file-status" id="hud-file-status"></span>
    <div class="hud-divider"></div>
    <div class="hud-actions">
      <button class="hud-btn" id="btn-add-node" data-tooltip="新建节点">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="hud-btn" id="btn-undo" data-tooltip="撤销 (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
      </button>
      <button class="hud-btn" id="btn-redo" data-tooltip="重做 (Ctrl+Y)">
        <svg viewBox="0 0 24 24"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path></svg>
      </button>
      <div class="hud-divider"></div>
      <button class="hud-btn" id="btn-open" data-tooltip="打开文件">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <button class="hud-btn" id="btn-save" data-tooltip="保存图谱 (Ctrl+S)">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      </button>
      <button class="hud-btn" id="btn-reset" data-tooltip="重置画布">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
      </button>
    </div>
  </header>

  <!-- 多选卡片对齐工具栏 -->
  <div id="alignment-bar" class="hud-bar alignment-bar" style="display: none;">
    <button class="hud-btn" id="btn-align-left" data-tooltip="左对齐">
      <svg viewBox="0 0 24 24"><line x1="4" y1="4" x2="4" y2="20"></line><rect x="7" y="6" width="13" height="5" rx="1.5"></rect><rect x="7" y="13" width="9" height="5" rx="1.5"></rect></svg>
    </button>
    <button class="hud-btn" id="btn-align-center-h" data-tooltip="水平居中对齐">
      <svg viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="21"></line><rect x="4" y="6" width="16" height="5" rx="1.5"></rect><rect x="6" y="13" width="12" height="5" rx="1.5"></rect></svg>
    </button>
    <button class="hud-btn" id="btn-align-right" data-tooltip="右对齐">
      <svg viewBox="0 0 24 24"><line x1="20" y1="4" x2="20" y2="20"></line><rect x="4" y="6" width="13" height="5" rx="1.5"></rect><rect x="8" y="13" width="9" height="5" rx="1.5"></rect></svg>
    </button>
    <div class="hud-divider"></div>
    <button class="hud-btn" id="btn-align-top" data-tooltip="顶部对齐">
      <svg viewBox="0 0 24 24"><line x1="4" y1="4" x2="20" y2="4"></line><rect x="6" y="7" width="5" height="13" rx="1.5"></rect><rect x="13" y="7" width="5" height="9" rx="1.5"></rect></svg>
    </button>
    <button class="hud-btn" id="btn-align-center-v" data-tooltip="垂直居中对齐">
      <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><rect x="6" y="4" width="5" height="16" rx="1.5"></rect><rect x="13" y="6" width="5" height="12" rx="1.5"></rect></svg>
    </button>
    <button class="hud-btn" id="btn-align-bottom" data-tooltip="底部对齐">
      <svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="20"></line><rect x="6" y="4" width="5" height="13" rx="1.5"></rect><rect x="13" y="8" width="5" height="9" rx="1.5"></rect></svg>
    </button>
    <div class="hud-divider"></div>
    <button class="hud-btn" id="btn-distribute-h" data-tooltip="水平均分">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="5" height="14" rx="1.5"></rect><rect x="16" y="5" width="5" height="14" rx="1.5"></rect><line x1="12" y1="4" x2="12" y2="20" stroke-dasharray="2 2"></line></svg>
    </button>
    <button class="hud-btn" id="btn-distribute-v" data-tooltip="垂直均分">
      <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="5" rx="1.5"></rect><rect x="5" y="16" width="14" height="5" rx="1.5"></rect><line x1="4" y1="12" x2="20" y2="12" stroke-dasharray="2 2"></line></svg>
    </button>
  </div>

  <!-- 无限画布视口 -->
  <main id="viewport">
    <div id="board">
      <svg id="wire-svg"></svg>
      <div id="cards-container"></div>
    </div>
  </main>

  <!-- 鼠标直接拉选框 -->
  <div id="marquee-box"></div>

  <!-- 划选/改色浮动工具栏（5常用色 + 1调色盘 + 确认应用按钮） -->
  <div id="selection-popover">
    <div class="popover-colors-row">
      <button class="popover-color-btn" data-color="#30d158" style="--btn-color: #30d158;" title="绿色"></button>
      <button class="popover-color-btn" data-color="#0a84ff" style="--btn-color: #0a84ff;" title="蓝色"></button>
      <button class="popover-color-btn" data-color="#bf5af2" style="--btn-color: #bf5af2;" title="紫色"></button>
      <button class="popover-color-btn" data-color="#ffd60a" style="--btn-color: #ffd60a;" title="黄色"></button>
      <button class="popover-color-btn" data-color="#ff9f0a" style="--btn-color: #ff9f0a;" title="橙色"></button>
      <div class="popover-divider"></div>
      <label class="popover-palette-btn" title="自定义调色盘">
        <input type="color" class="popover-color-picker" value="#30d158" />
      </label>
    </div>
    <button class="popover-apply-btn" id="popover-apply-btn" title="确认应用此颜色">
      <span class="apply-color-dot"></span>
      <span>应用</span>
    </button>
  </div>

  <!-- 胶囊操作条（点击胶囊后显示删除按钮） -->
  <div id="capsule-action-bar" class="capsule-action-bar" style="display: none;">
    <button class="capsule-delete-btn" id="btn-delete-capsule" title="删除胶囊 (Delete)">
      <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      <span>删除</span>
    </button>
  </div>

  <!-- 导线拖拽释放选单（未连接到节点时弹出） -->
  <div id="wire-drop-menu" class="wire-drop-menu" style="display: none;">
    <button class="wire-drop-menu-item" id="btn-wire-spawn-node">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <span>新建节点</span>
    </button>
  </div>

  <!-- 原生 ES 模块启动 -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
